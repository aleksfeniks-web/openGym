# Reset Gym — comprueba que la imagen del servidor de Render compila y arranca, y que el inicio de
# sesión con usuario y contraseña funciona (cuentas de prueba, no las reales).

name: Reset Gym servidor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['render/**', 'catalogue/media/**', 'api/**', 'frontend/**', 'web/nginx.conf.template', 'render.yaml', '.github/workflows/reset-gym-server.yml']

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas de la marca por gimnasio
        run: node --test render/brand.test.mjs

      - name: Compilar la imagen de Render
        run: docker build -f render/Dockerfile -t reset-gym .

      - name: Arrancar y probar el inicio de sesión
        run: |
          set -eu
          docker run -d --name rg -p 10000:10000 -e PORT=10000 \
            -e PASSWORD_LOGIN=1 -e INVITE_ONLY=1 -e ALLOW_GUEST=0 -e DEFAULT_LANG=es \
            -e RESET_ACCOUNTS='[{"name":"prueba","password":"clave-de-prueba"},{"name":"jefe","password":"otra-clave","admin":true}]' \
            reset-gym
          for i in $(seq 1 30); do curl -fs localhost:10000/api/health >/dev/null && break; sleep 2; done
          docker logs rg
          curl -fs localhost:10000/ | grep -q "<title>Reset Gym</title>"
          curl -fs -o /dev/null localhost:10000/api/health
          curl -fsI localhost:10000/exercise-media/still/0001.webp | grep -qi 'content-type: image/webp'
          # Otros sitios: bloqueados. La app (https://localhost): permitida, con CORS para fetch().
          curl -fsI localhost:10000/exercise-media/still/0001.webp -H 'Referer: https://otro-sitio.example/' | grep -qi 'cross-origin-resource-policy: same-origin'
          curl -fsI localhost:10000/exercise-media/still/0001.webp -H 'Referer: https://localhost/' | grep -qi 'cross-origin-resource-policy: cross-origin'
          curl -fsI localhost:10000/exercise-media/clip/$(docker exec rg ls /usr/share/nginx/html/exercise-media/clip | head -1) -H 'Origin: https://localhost' > /tmp/h
          grep -qi 'cross-origin-resource-policy: cross-origin' /tmp/h
          grep -qi 'access-control-allow-origin: https://localhost' /tmp/h
          H='Content-Type: application/json'
          curl -fs -X POST localhost:10000/api/app/login/password -H "$H" -H 'Origin: https://localhost' \
            -d '{"name":"jefe","password":"otra-clave"}' | grep -q '"admin":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:10000/api/app/login/password -H "$H" -H 'Origin: https://localhost' \
            -d '{"name":"prueba","password":"mal"}')
          test "$code" = 401
          echo "Servidor de Reset Gym: OK"

      - name: Arrancar con la marca de un gimnasio
        run: |
          set -eu
          docker run -d --name gym -p 10001:10000 -e PORT=10000 -e PASSWORD_LOGIN=1 -e INVITE_ONLY=1 -e ALLOW_GUEST=0 \
            -e GYM_NAME='Gym Titán' -e GYM_COLOR='#ff6a00' \
            -e GYM_LOGO_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/frontend/public/icon-512.png" \
            -e RESET_ACCOUNTS='[{"name":"prueba","password":"clave-de-prueba"}]' \
            reset-gym
          for i in $(seq 1 30); do curl -fs localhost:10001/api/health >/dev/null && break; sleep 2; done
          docker logs gym | grep 'Marca: Gym Titán'
          curl -fs localhost:10001/ | grep -q '<title>Gym Titán</title>'
          curl -fs localhost:10001/ | grep -q 'window.__GYM__'
          curl -fs localhost:10001/manifest.json | grep -q '"name": "Gym Titán"'
          logo=$(curl -fs localhost:10001/manifest.json | grep -o 'gym-logo-[a-f0-9]*\.png' | head -1)
          test -n "$logo"
          curl -fsI "localhost:10001/$logo" | grep -qi 'content-type: image/png'
          echo "Marca por gimnasio: OK"
